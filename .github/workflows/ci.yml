name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BusinessOS.sln

      - name: Build
        run: dotnet build BusinessOS.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BusinessOS.sln --no-build --configuration Release
